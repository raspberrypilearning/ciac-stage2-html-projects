<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Second Wear - Pre-loved secondhand clothing - Contact us</title>
  </head>
  <body>
     <header>
      <div class="logo">
        <a href="index.html">
          <img src="logo.svg" alt="Second Wear logo" width="70" height="70">
          <span class="logo-text">Second Wear</span>
        </a>
      </div>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="sustainability.html">Sustainability</a></li>
          <li><a href="our-shop.html">Find our shop</a></li>
          <li class="selected"><a href="contact.html">Contact us</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="container">
        <h1>Contact us</h1>
        <div class="contact">
          <p>
            Fill in the form to get in contact with us and one of our team will get back to you as soon as we can.
          </p>
          <form>
            <label for="name">Full Name</label><br>
            <input type="text" id="name" name="full-name" placeholder="Your full name...">

            <label for="email">Email</label>
            <input type="text" id="email" name="email" placeholder="Your email...">

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="How can we help!" style="height:200px"></textarea>

            <input type="submit" value="Submit">
          </form>
        </div>
      </section>
    </main>
    <footer>
      <nav class="bottom-nav">
        <ul>
          <li><a href="index.html">Home</a></li> | 
          <li><a href="sustainability.html">Sustainability</a></li> | 
          <li><a href="our-shop.html">Find our shop</a></li> | 
          <li><a href="contact.html">Contact us</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
